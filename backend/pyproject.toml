[project]
name = "gym-membership-management-backend"
version = "0.1.0"
description = "FastAPI backend for the Gym Membership Management System"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.16",
  "fastapi>=0.118",
  "pydantic-settings>=2.10",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-cov>=7.0",
  "ruff>=0.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
packages = ["app"]
