name: Phase 4F formatter

on:
  push:
    branches:
      - feat/phase-4f-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-4f-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Format regression test
        working-directory: frontend
        run: pnpm exec prettier --write src/components/WorkspaceShell.test.tsx
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/WorkspaceShell.test.tsx
          if git diff --cached --quiet; then
            echo "No formatter changes required"
          else
            git commit -m "style(4f): apply pinned Prettier output"
            git push origin HEAD:feat/phase-4f-hardening
          fi
