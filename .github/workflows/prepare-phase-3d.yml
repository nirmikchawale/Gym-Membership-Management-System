name: Prepare Phase 3D

on:
  push:
    branches:
      - feat/phase-3d-gridstone-shell

permissions:
  contents: write

jobs:
  prepare:
    if: "${{ !contains(github.event.head_commit.message, 'chore: prepare Phase 3D') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-3d-gridstone-shell
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false
      - name: Resolve dependencies and format frontend
        working-directory: frontend
        run: |
          pnpm install
          pnpm format
      - name: Commit prepared Phase 3D files and remove one-use workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-phase-3d.yml
          git add frontend
          git commit -m "chore: prepare Phase 3D dependencies and formatting"
          git push
