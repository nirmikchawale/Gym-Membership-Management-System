name: Format populated demo

on:
  push:
    branches: [feat/populated-public-demo]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/populated-public-demo
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Format frontend
        working-directory: frontend
        run: pnpm format
      - name: Remove one-use workflow
        run: rm .github/workflows/format-populated-demo.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend .github/workflows/format-populated-demo.yml
          git commit -m "style: format populated demo"
          git push origin HEAD:feat/populated-public-demo
