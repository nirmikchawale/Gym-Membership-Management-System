name: Format Members slice

on:
  push:
    branches: [feat/members-theme-security-hardening]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/members-theme-security-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Format frontend
        working-directory: frontend
        run: pnpm exec prettier --write .
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
          python-version: '3.14'
          enable-cache: true
      - name: Install backend dependencies
        run: uv sync --project backend --frozen --group dev
      - name: Fix and format backend
        run: |
          uv run --project backend ruff check backend --fix
          uv run --project backend ruff format backend
      - name: Remove one-use workflow
        run: rm .github/workflows/format-members.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format Members slice"
          git push origin HEAD:feat/members-theme-security-hardening
