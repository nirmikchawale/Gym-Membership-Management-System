name: Normalize Phase 4D Frontend Once

on:
  push:
    branches: [feat/phase-4d-dashboard]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-4d-dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Format Phase 4D frontend
        working-directory: frontend
        run: pnpm exec prettier --write src/lib/navigation.ts src/pages/HomePage.tsx src/pages/ReportsPage.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/navigation.ts frontend/src/pages/HomePage.tsx frontend/src/pages/ReportsPage.tsx
          git commit -m "style: normalize Phase 4D frontend"
          git push origin HEAD:feat/phase-4d-dashboard
