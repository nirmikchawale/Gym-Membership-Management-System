name: Prepare Phase 3C dependencies and formatting

on:
  push:
    branches: [feat/phase-3c-authentication]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-3c-authentication
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Format frontend
        working-directory: frontend
        run: pnpm format
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
          python-version: '3.14'
      - name: Refresh backend lockfile
        run: uv lock --project backend
      - name: Format backend
        run: uv run --project backend ruff format backend
      - name: Remove temporary workflow
        run: rm .github/workflows/prepare-phase-3c.yml
      - name: Commit prepared files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: prepare Phase 3C dependencies and formatting"
          git push origin HEAD:feat/phase-3c-authentication
