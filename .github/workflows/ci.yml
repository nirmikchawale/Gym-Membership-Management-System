name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test:run
      - name: Build
        run: pnpm build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: gym_membership
          POSTGRES_USER: gym_app
          POSTGRES_PASSWORD: gym_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym_app -d gym_membership"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gym_app:gym_dev_password@localhost:5432/gym_membership
      APP_ENV: test
      APP_TIMEZONE: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
          python-version: '3.14'
          enable-cache: true
      - name: Install dependencies
        run: uv sync --project backend --frozen --group dev
      - name: Apply database migrations
        run: uv run --project backend alembic -c backend/alembic.ini upgrade head
      - name: Check migration drift
        run: uv run --project backend alembic -c backend/alembic.ini check
      - name: Ruff lint
        run: uv run --project backend ruff check backend
      - name: Ruff format
        run: uv run --project backend ruff format --check backend
      - name: Typecheck
        run: uv run --project backend mypy backend/app backend/tests
      - name: Tests
        working-directory: backend
        run: uv run python -m pytest
      - name: Verify migration reversibility
        run: |
          uv run --project backend alembic -c backend/alembic.ini downgrade base
          uv run --project backend alembic -c backend/alembic.ini upgrade head

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false
      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
          python-version: '3.14'
          enable-cache: true
      - name: Audit backend dependencies
        run: |
          uv export --project backend --frozen --no-hashes --output-file /tmp/gridstone-requirements.txt
          uvx --from pip-audit pip-audit --progress-spinner off -r /tmp/gridstone-requirements.txt

  container:
    runs-on: ubuntu-latest
    needs: [frontend, backend, security]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start stack
        run: docker compose up -d --build
      - name: Verify single-origin app, deep links, migrations, API and PostgreSQL
        run: |
          healthy=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8000/api/v1/health; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" != true ]; then
            docker compose logs
            exit 1
          fi

          curl --fail --silent --show-error http://localhost:8000/ | grep -q '<title>Gridstone'
          curl --fail --silent --show-error http://localhost:8000/members | grep -q '<title>Gridstone'
          curl --fail --silent --show-error -D - -o /dev/null http://localhost:8000/api/v1/health | grep -qi 'x-content-type-options: nosniff'
      - name: Stop stack
        if: always()
        run: docker compose down -v
