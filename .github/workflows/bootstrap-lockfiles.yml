name: Bootstrap lockfiles

on:
  push:
    branches: [feat/phase-3a-foundation]

permissions:
  contents: write

jobs:
  lockfiles:
    if: "${{ !contains(github.event.head_commit.message, 'chore: generate dependency lockfiles') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false
      - name: Generate pnpm lockfile
        working-directory: frontend
        run: pnpm install --lockfile-only
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
          python-version: '3.14'
      - name: Generate uv lockfile
        run: uv lock --project backend
      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/pnpm-lock.yaml backend/uv.lock
          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git commit -m "chore: generate dependency lockfiles"
          git push
